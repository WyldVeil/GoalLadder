[package]
name = "goalladder"
version = "1.0.0"
description = "Goal Ladder, a simple tracker for goals that unlock one after another"
authors = ["WyldVeil"]
edition = "2021"

[lib]
name = "goalladder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
